# Render blueprint - single web service running the Docker image.
# Deploy: push this branch, then in Render choose New > Blueprint and point at the repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bussess-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Only a deliberate deploy publishes. Set true to redeploy on every push.
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      # --- required: paste the Supabase session-pooler URL (port 5432) ---
      - key: DATABASE_URL
        sync: false
      # --- generated by Render, not reused from local .env ---
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      # Demo build: deterministic, free, and no third-party key to rotate.
      - key: AI_PROVIDER
        value: mock
      - key: APP_NAME
        value: AI Business Automation Platform
